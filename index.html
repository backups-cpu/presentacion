<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación Fullscreen</title>
  <style>
    /* Asegura que el contenedor ocupe TODA la pantalla sin márgenes */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Evita barras de desplazamiento */
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    img {
      /* Estilos clave para pantalla completa adaptable */
      width: 100%;
      height: 100%;
      object-fit: cover; /* CUBRE todo el espacio, recortando bordes si es necesario */
      object-position: center; /* Centra la imagen al recortar */
      display: block;
    }
  </style>
</head>
<body>

  <!-- Imagen donde se mostrará la diapositiva -->
  <img id="slide" src="" alt="Diapositiva">

  <script>
    // Tus enlaces exactos de GitHub
    const imagenes = [
      "https://github.com/user-attachments/assets/4cb8a8f0-c298-4092-ad14-79950908d801",
      "https://github.com/user-attachments/assets/16606b8f-a224-4c2f-9381-4eefd4a6d34c",
      "https://github.com/user-attachments/assets/bb5728aa-c66d-4e6b-a872-88bda1389fdd",
      "https://github.com/user-attachments/assets/5b4b2e9e-e6d3-40ac-91a9-c3be60830823"
    ];

    let indiceActual = 0;
    const imgElement = document.getElementById('slide');

    // Función para cambiar la imagen
    function actualizarImagen() {
      imgElement.src = imagenes[indiceActual];
    }

    // Al hacer clic en cualquier parte, avanza o vuelve al inicio (bucle)
    document.body.addEventListener('click', () => {
      indiceActual = (indiceActual + 1) % imagenes.length;
      actualizarImagen();
    });

    // Cargar la primera imagen al iniciar
    actualizarImagen();
  </script>

</body>
</html>
