<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- Imagen donde se mostrará la diapositiva -->
  <img id="slide" src="" alt="Diapositiva">

  <script>
    // 1. Pega aquí la lista de URLs directas de tus imágenes
    const imagenes = [
      "URL_DE_TU_IMAGEN_1",
      "URL_DE_TU_IMAGEN_2",
      "URL_DE_TU_IMAGEN_3"
    ];

    let indiceActual = 0;
    const imgElement = document.getElementById('slide');

    // Muestra la primera imagen al cargar
    function actualizarImagen() {
      imgElement.src = imagenes[indiceActual];
    }

    // Al hacer clic en cualquier parte de la pantalla, avanza o vuelve al inicio
    document.body.addEventListener('click', () => {
      indiceActual = (indiceActual + 1) % imagenes.length; // Hace el bucle automático
      actualizarImagen();
    });

    actualizarImagen();
  </script>

</body>
</html>
