<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <img id="slide" src="" alt="Diapositiva">

  <script>
    // Nombres exactos de las imágenes que subiste al repositorio
    const imagenes = [
      "1.png",
      "2.png",
      "3.png",
      "4.png"
    ];

    let indiceActual = 0;
    const imgElement = document.getElementById('slide');

    function actualizarImagen() {
      imgElement.src = imagenes[indiceActual];
    }

    document.body.addEventListener('click', () => {
      indiceActual = (indiceActual + 1) % imagenes.length;
      actualizarImagen();
    });

    actualizarImagen();
  </script>

</body>
</html>
