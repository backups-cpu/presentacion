<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <img id="slide" src="" alt="Diapositiva">

  <script>
    // Pega aquí las URLs de tus 4 imágenes de GitHub Issues
    const imagenes = [
      "https://github.com/user-attachments/assets/LINK_1",
      "https://github.com/user-attachments/assets/LINK_2",
      "https://github.com/user-attachments/assets/LINK_3",
      "https://github.com/user-attachments/assets/LINK_4"
    ];

    let indiceActual = 0;
    const imgElement = document.getElementById('slide');

    function actualizarImagen() {
      imgElement.src = imagenes[indiceActual];
    }

    // Al hacer clic, incrementa y aplica el módulo para crear el bucle infinito
    document.body.addEventListener('click', () => {
      indiceActual = (indiceActual + 1) % imagenes.length;
      actualizarImagen();
    });

    // Cargar la primera imagen al iniciar
    actualizarImagen();
  </script>

</body>
</html>
